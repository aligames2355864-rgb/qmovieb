<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وضاح | مبرمج ويب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121417;
            --card-bg: #ffffff;
            --text-main: #ffffff;
            --text-dark: #121417;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #ccc;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        .profile-img-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid white;
            overflow: hidden;
            margin: 0 auto 30px;
            background-color: #2a2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card {
            background-color: var(--card-bg);
            color: var(--text-dark);
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card h2 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            text-align: right;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .card p {
            line-height: 1.8;
            font-size: 1.05rem;
            color: #444;
            text-align: right;
            margin: 10px 0 0 0;
        }

        .flag { width: 25px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="header">
        <h1>وضاح <img src="https://upload.wikimedia.org/wikipedia/commons/f/f6/Flag_of_Iraq.svg" class="flag" alt="Iraq"></h1>
        <p>مبرمج من العراق، مهتم بتطوير الويب والتقنيات الحديثة</p>
    </div>

    <div class="profile-img-container">
        <img src="https://i.ibb.co/3mNf3fP/image.png" alt="وضاح">
    </div>

    <div class="card">
        <h2>من أنا؟</h2>
        <p>
            أنا وضاح، مبرمج عراقي  🇮🇶، شغوف بتطوير المواقع والتطبيقات. أعمل على بناء حلول برمجية فعالة باستخدام أحدث التقنيات.
        </p>
    </div>

    <div class="card">
        <h2>مشاريعي</h2>
        <p>قريباً سيتم استعراض أفضل المشاريع البرمجية هنا...</p>
    </div>

</body>
</html>
