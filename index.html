<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waddah | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex_Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* خلفية داكنة مثل الصورة */
            color: white;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            text-align: center;
            width: 100%;
            max-width: 350px;
        }

        /* الإطار الملون حول الصورة */
        .image-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 8px; /* المسافة بين الصورة والإطار */
            background: linear-gradient(45deg, #00f2fe, #4facfe, #7000ff);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #121212; /* فجوة بسيطة بين الصورة والإطار */
        }

        h1 {
            font-size: 32px;
            margin: 10px 0;
            font-weight: 600;
        }

        .title {
            color: #b0b0b0;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #2a2a2a;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.3s ease;
            border: 1px solid #3d3d3d;
        }

        .btn:hover {
            background-color: #3d3d3d;
            transform: translateY(-3px);
            border-color: #4facfe;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="image-container">
            <img src="waddah.jpg" alt="Waddah" class="profile-img">
        </div>
        
        <h1>وضاح</h1>
        <div class="title">Software Developer</div>

        <div class="links">
            <a href="#" class="btn">GitHub</a>
            <a href="#" class="btn">LinkedIn</a>
            <a href="#" class="btn">Contact Me</a>
        </div>
    </div>

</body>
</html>
